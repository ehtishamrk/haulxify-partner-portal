<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" href="images/haulxify.webp" type="image/webp">
 <title>Accounts & Billing — Haulxify Partner Portal</title>
 <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="finance.css">
 <script src="vendor/supabase-2.117.2.js"></script><script src="config.js"></script>
</head>
<body class="finance-page">
 <div id="topnav-mount" data-nav-label="Accounts & Billing"></div>
 <main class="finance-wrap" id="finance-main">
  <div id="finance-loading" class="loading-wrap" role="status"><div class="spinner"></div> Loading accounts…</div>
  <div id="finance-error" class="finance-message hidden" role="alert"></div>
  <div id="finance-app" class="hidden">
   <header class="finance-header">
    <div><div class="finance-eyebrow" id="finance-business">HAULXIFY</div><h1>Accounts & Billing</h1><p>Every invoice, expense and balance, in one place.</p></div>
    <div class="finance-header-actions"><span id="finance-access" class="finance-access"></span><button class="btn btn-ghost" id="finance-refresh" type="button">↻ Refresh</button></div>
   </header>
   <nav id="finance-tabs" class="finance-tabs" aria-label="Accounts sections"></nav>
   <div id="finance-filters"></div>
   <section id="finance-content" aria-live="polite" aria-busy="false"></section>
  </div>
 </main>
 <dialog id="finance-dialog" class="finance-dialog" aria-labelledby="finance-dialog-title">
  <div class="finance-dialog-header"><h2 id="finance-dialog-title"></h2><button type="button" class="btn btn-ghost btn-sm" id="finance-dialog-close" aria-label="Close dialog">✕</button></div>
  <div id="finance-dialog-body"></div>
 </dialog>
 <div id="toast-container" aria-live="polite"></div>
 <script src="app.js"></script><script src="finance-core.js"></script>
 <script src="vendor/jspdf-4.2.1.umd.min.js"></script><script src="finance-pdf.js"></script>
 <script src="finance.js"></script>
</body>
</html>
